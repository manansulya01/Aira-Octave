# mdev.conf — BusyBox mdev device node permissions (AiraOS-Octave).
#
# WHY THIS FILE EXISTS: without it, `mdev -s` creates every node with mode
# 0600 root-only. Standard nodes like /dev/null, /dev/zero and /dev/urandom
# must be world-accessible or unprivileged users cannot run anything that
# redirects output (observed: aira-ipc as uid 1000 failed with
# "can't create /dev/null: Permission denied").
#
# Format: DEVNAME-REGEX UID:GID PERM [>|=PATH]
null    root:root 666
zero    root:root 666
full    root:root 666
random  root:root 666
urandom root:root 666
tty     root:tty  666
tty[0-9]* root:tty 620
console root:root 600
ptmx    root:tty  666
pts/[0-9]* root:tty 620
kmsg    root:root 600
# Block devices: root owns them; access is granted by group policy instead of
# world-writable, so a compromised service cannot read raw disks by default.
vd[a-z]  root:disk 660
sd[a-z]  root:disk 660
sr[0-9]  root:disk 660
nvme[0-9]n*[0-9] root:disk 660
loop[0-9]* root:disk 660
# Audio devices are available to the audio group, not world-writable.
snd/.* root:audio 660

# Network/tty dynamic nodes.
vcs[0-9]* root:tty 600
# Input devices (event nodes) — root only; GUI stack runs as the session user
# and reads input through the X server, not raw evdev nodes.
input/event* root:root 640
# Memory/PCI/USB introspection stays root-only.
bus/pci root:root 600